<!DOCTYPE html>
<html lang="en">
<head>
  <!-- META -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nimbus — Stream Anime</title>

  <!-- FONTS: Bebas Neue (cinematic titles) · Outfit (body) · Noto Sans JP (Japanese) -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />

  <!--
    CSS LOAD ORDER — base.css must be first (all others depend on its variables):
      base.css       → design tokens, reset, utilities, buttons, animations
      navbar.css     → fixed top bar, search input, avatar button
      ticker.css     → scrolling news strip
      hero.css       → rotating hero banner + dot navigation
      card.css       → anime cards, coming soon cards, status badges
      browse.css     → browse page filters, search bar, sort dropdown
      detail.css     → detail page hero, episode list, info sidebar
      watch.css      → video player, episode sidebar, comment section
      mylist.css     → list tabs, list items, empty state
      footer.css     → site footer grid
  -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/ticker.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/browse.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <link rel="stylesheet" href="css/watch.css" />
  <link rel="stylesheet" href="css/mylist.css" />
  <link rel="stylesheet" href="css/footer.css" />

  <!-- REACT 18 + BABEL (in-browser JSX transpiler) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <!-- React mounts here -->
  <div id="root"></div>

  <!--
    JS LOAD ORDER — each file depends on the ones above it:
      js/data.js        → raw data arrays (ANIME_DB, COMING_SOON, UPDATES, INITIAL_COMMENTS)
      js/helpers.js     → loadStorage / saveStorage / fmt / stars / useToast
      js/icons.js       → SVG icon components (IconPlay, IconHeart, …)
      js/components.js  → shared UI (Navbar, AnimeCard, HeroBanner, Footer, ToastContainer)
      js/pages.js       → page components (HomePage, BrowsePage, DetailPage, WatchPage, …)
      js/app.js         → root App + ReactDOM.createRoot entry point
  -->
  <script type="text/babel" src="js/data.js"></script>
  <script type="text/babel" src="js/helpers.js"></script>
  <script type="text/babel" src="js/icons.js"></script>
  <script type="text/babel" src="js/components.js"></script>
  <script type="text/babel" src="js/pages.js"></script>
  <script type="text/babel" src="js/app.js"></script>

</body>
</html>
