<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nimbus — Stream Anime</title>

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet"/>

  <!--
    CSS LOAD ORDER — base.css first (design tokens):
      base.css → navbar.css → ticker.css → hero.css → card.css
      browse.css → detail.css → watch.css → mylist.css → footer.css
  -->
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/navbar.css"/>
  <link rel="stylesheet" href="css/ticker.css"/>
  <link rel="stylesheet" href="css/hero.css"/>
  <link rel="stylesheet" href="css/card.css"/>
  <link rel="stylesheet" href="css/browse.css"/>
  <link rel="stylesheet" href="css/detail.css"/>
  <link rel="stylesheet" href="css/watch.css"/>
  <link rel="stylesheet" href="css/mylist.css"/>
  <link rel="stylesheet" href="css/footer.css"/>

  <!-- REACT 18 + BABEL -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Extra: make iframe inside StreamingPlayer fill its container correctly */
    .video-container { position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; }
    .video-container iframe,
    .video-container > div { position:absolute; inset:0; width:100%; height:100%; }
  </style>
</head>
<body>

  <!--
    ⚠ CORS NOTE
    The Jikan API (api.jikan.moe) allows browser requests directly.
    AniList (graphql.anilist.co) also allows browser CORS.
    Gogoanime embeds require the page to be served from a real HTTP
    server (not file://). Use:
        npx serve .
    or
        python3 -m http.server 8080
    then open http://localhost:8080
  -->

  <div id="root"></div>

  <!--
    JS LOAD ORDER:
      data.js      → API fetchers, normalisers, window.__NimbusData promise
      helpers.js   → localStorage / fmt / stars / useToast
      icons.js     → SVG icon components
      components.js→ Navbar, AnimeCard, HeroBanner, Footer, ToastContainer
      pages.js     → HomePage, BrowsePage, DetailPage, WatchPage, StreamingPlayer, …
      app.js       → root App + ReactDOM.createRoot entry point
  -->
  <script type="text/babel" src="js/data.js"></script>
  <script type="text/babel" src="js/helpers.js"></script>
  <script type="text/babel" src="js/icons.js"></script>
  <script type="text/babel" src="js/components.js"></script>
  <script type="text/babel" src="js/config.js"></script>
  <script type="text/babel" src="js/player.js"></script>
  <script type="text/babel" src="js/pages.js"></script>
  <script type="text/babel" src="js/app.js"></script>

</body>
</html>
